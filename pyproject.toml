[project]
name = "keim"
version = "1.0.0"
description = "KEIM - Scalar statistics on linked files (DAMPF DB / index.jsonl)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "tifffile>=2021.0",
    "Pillow>=8.0",
    "h5py>=3.0",
    "PySide6>=6.4",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.0",
]
